name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: playwright install --with-deps chromium
      - name: Unit- en browsertests
        run: python -m pytest tests -q
      - name: Elke wetsverwijzing van de rekenkern staat in het corpus
        run: python scripts/valideer_grondslagen.py
      - name: Harde checks op de 120 casussen (zonder taalmodel)
        run: python scripts/criticus_ronde.py deterministisch
